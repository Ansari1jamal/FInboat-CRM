name: FinBoat Production Deploy

on:
  workflow_run:
    workflows:
      - FinBoat CI
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: finboat-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/finboat

            git fetch origin main
            git reset --hard origin/main

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d --build

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              exec -T api npx prisma migrate deploy

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              exec -T api node -e "require('http').get('http://127.0.0.1:5000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              ps
