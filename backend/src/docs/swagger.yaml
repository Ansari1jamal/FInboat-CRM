  # ====================================================
  # COMPONENTS
  # ====================================================

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT token

  schemas:

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: Operation successful

        data:
          nullable: true
          example: {}

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false

        message:
          type: string
          example: Something went wrong

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false

        message:
          type: string
          example: Validation failed

        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: mobile

              message:
                type: string
                example: Mobile must be 10 digits

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 20

        total:
          type: integer
          example: 100

        totalPages:
          type: integer
          example: 5

    Lead:
      type: object
      properties:

        id:
          type: string
          example: cm123abc

        customerName:
          type: string
          example: Rahul Kumar

        mobile:
          type: string
          example: "9876543210"

        loanType:
          type: string
          example: PERSONAL

        loanAmount:
          type: number
          example: 500000

        source:
          type: string
          example: WEBSITE

        status:
          type: string
          example: NEW

        assignedToId:
          type: string
          nullable: true
          example: cm456user

        assignedTeamId:
          type: string
          nullable: true
          example: cm789team

        isDuplicate:
          type: boolean
          example: false

        duplicateOf:
          type: string
          nullable: true
          example: null

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    CreateLeadRequest:
      type: object

      required:
        - customerName
        - mobile
        - loanType
        - loanAmount

      properties:

        customerName:
          type: string
          example: Rahul Kumar

        mobile:
          type: string
          example: "9876543210"

        loanType:
          type: string
          example: PERSONAL

        loanAmount:
          type: number
          example: 500000

        source:
          type: string
          example: WEBSITE

        assignedToId:
          type: string
          nullable: true

        assignedTeamId:
          type: string
          nullable: true

    AssignLeadRequest:
      type: object

      required:
        - toUserId

      properties:

        toUserId:
          type: string
          example: cm456user

        toTeamId:
          type: string
          nullable: true
          example: cm789team

        reason:
          type: string
          example: Reassigned to senior telecaller

    ChangeLeadStatusRequest:
      type: object

      required:
        - status

      properties:

        status:
          type: string
          enum:
            - NEW
            - INTERESTED
            - DOCUMENTS_PENDING
            - LOGIN
            - APPROVED
            - DISBURSED
            - REJECTED
          example: INTERESTED

        note:
          type: string
          example: Customer interested in personal loan

    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: admin@finboat.com

        password:
          type: string
          format: password
          example: Password@123

    LoginResponse:
      type: object
      properties:

        success:
          type: boolean
          example: true

        message:
          type: string
          example: Login successful

        data:
          type: object
          properties:

            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIs...

            user:
              type: object
              properties:

                id:
                  type: string
                  example: cm123user

                name:
                  type: string
                  example: Admin User

                email:
                  type: string
                  example: admin@finboat.com

                role:
                  type: string
                  example: ADMIN

  # ====================================================
  # PARAMETERS
  # ====================================================

  parameters:

    Id:

      name: id

      in: path

      required: true

      description: Resource ID

      schema:
        type: string

      example: cm123abc


  # ====================================================
  # SCHEMAS
  # ====================================================

  schemas:

    # ==================================================
    # LEAD
    # ==================================================

    Lead:

      type: object

      properties:

        id:
          type: string
          example: cm123abc

        customerName:
          type: string
          example: Rahul Kumar

        mobile:
          type: string
          example: "9876543210"

        loanType:
          type: string
          example: PERSONAL

        loanAmount:
          type: number
          format: double
          example: 500000

        source:
          type: string
          example: WEBSITE

        status:
          type: string
          enum:
            - NEW
            - INTERESTED
            - DOCUMENTS_PENDING
            - LOGIN
            - APPROVED
            - DISBURSED
            - REJECTED
          example: NEW

        assignedToId:
          type: string
          nullable: true
          example: cmtelecaller123

        assignedTeamId:
          type: string
          nullable: true
          example: cmteam123

        isDuplicate:
          type: boolean
          example: false

        duplicateOf:
          type: string
          nullable: true

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time


    CreateLeadRequest:

      type: object

      required:
        - customerName
        - mobile
        - loanType
        - loanAmount

      properties:

        customerName:
          type: string
          example: Rahul Kumar

        mobile:
          type: string
          minLength: 10
          maxLength: 10
          example: "9876543210"

        loanType:
          type: string
          example: PERSONAL

        loanAmount:
          type: number
          format: double
          example: 500000

        source:
          type: string
          example: WEBSITE

        assignedToId:
          type: string
          nullable: true

        assignedTeamId:
          type: string
          nullable: true


    UpdateLeadRequest:

      type: object

      properties:

        customerName:
          type: string

        mobile:
          type: string

        loanType:
          type: string

        loanAmount:
          type: number

        source:
          type: string


    AssignLeadRequest:

      type: object

      required:
        - toUserId

      properties:

        toUserId:
          type: string
          example: cmtelecaller123

        toTeamId:
          type: string
          nullable: true
          example: cmteam123

        reason:
          type: string
          example: Reassigned due to workload


    ChangeLeadStatusRequest:

      type: object

      required:
        - status

      properties:

        status:
          type: string
          enum:
            - NEW
            - INTERESTED
            - DOCUMENTS_PENDING
            - LOGIN
            - APPROVED
            - DISBURSED
            - REJECTED
          example: INTERESTED

        note:
          type: string
          example: Customer interested in loan


    # ==================================================
    # AUTH
    # ==================================================

    LoginRequest:

      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: admin@finboat.com

        password:
          type: string
          format: password
          example: Password@123


    LoginResponse:

      type: object

      properties:

        success:
          type: boolean
          example: true

        message:
          type: string
          example: Login successful

        data:

          type: object

          properties:

            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIs...

            user:
              $ref: "#/components/schemas/User"


    # ==================================================
    # USER
    # ==================================================

    User:

      type: object

      properties:

        id:
          type: string
          example: cmuser123

        name:
          type: string
          example: Admin User

        email:
          type: string
          format: email
          example: admin@finboat.com

        role:
          type: string
          enum:
            - ADMIN
            - MANAGER
            - TL
            - TELECALLER
          example: ADMIN

        managerId:
          type: string
          nullable: true

        tlId:
          type: string
          nullable: true

        isActive:
          type: boolean
          example: true

        createdAt:
          type: string
          format: date-time


    CreateUserRequest:

      type: object

      required:
        - name
        - email
        - password
        - role

      properties:

        name:
          type: string
          example: Rahul Sharma

        email:
          type: string
          format: email
          example: rahul@finboat.com

        password:
          type: string
          format: password
          example: Password@123

        role:
          type: string
          enum:
            - ADMIN
            - MANAGER
            - TL
            - TELECALLER

        managerId:
          type: string
          nullable: true

        tlId:
          type: string
          nullable: true


    # ==================================================
    # TEAM
    # ==================================================

    CreateTeamRequest:

      type: object

      required:
        - name

      properties:

        name:
          type: string
          example: Delhi Sales Team

        description:
          type: string
          example: Personal loan sales team


    # ==================================================
    # CALL
    # ==================================================

    CreateCallRequest:

      type: object

      required:
        - leadId
        - status

      properties:

        leadId:
          type: string
          example: cmlead123

        status:
          type: string
          enum:
            - CONNECTED
            - NOT_CONNECTED
            - BUSY
            - WRONG_NUMBER
          example: CONNECTED

        notes:
          type: string
          example: Customer requested callback tomorrow

        duration:
          type: integer
          nullable: true
          example: 180


    # ==================================================
    # FOLLOW UP
    # ==================================================

    CreateFollowUpRequest:

      type: object

      required:
        - followUpDate

      properties:

        followUpDate:
          type: string
          format: date-time
          example: 2026-09-15T10:30:00Z

        notes:
          type: string
          example: Customer will submit documents


    UpdateFollowUpRequest:

      type: object

      properties:

        status:
          type: string
          enum:
            - PENDING
            - DONE
            - MISSED
          example: DONE

        notes:
          type: string
          example: Customer submitted documents.


    # ==================================================
    # APPLICATION
    # ==================================================

    CreateApplicationRequest:

      type: object

      properties:

        lenderId:
          type: string
          nullable: true

        loanAmount:
          type: number
          example: 500000

        notes:
          type: string
          nullable: true


    ChangeApplicationStatusRequest:

      type: object

      required:
        - status

      properties:

        status:
          type: string
          example: APPROVED

        note:
          type: string
          example: Application approved by lender


    # ==================================================
    # LENDER
    # ==================================================

    CreateLenderRequest:

      type: object

      required:
        - name

      properties:

        name:
          type: string
          example: HDFC Bank

        code:
          type: string
          example: HDFC

        description:
          type: string
          nullable: true


    # ==================================================
    # LOAN
    # ==================================================

    ConvertLoanRequest:

      type: object

      properties:

        loanAccountNumber:
          type: string
          nullable: true
          example: LN-2026-000123

        interestRate:
          type: number
          example: 10.5

        tenureMonths:
          type: integer
          example: 60


    # ==================================================
    # EMI
    # ==================================================

    CreateEmiScheduleRequest:

      type: object

      required:
        - principalAmount
        - interestRate
        - tenureMonths
        - firstDueDate

      properties:

        principalAmount:
          type: number
          example: 500000

        interestRate:
          type: number
          example: 10.5

        tenureMonths:
          type: integer
          example: 60

        firstDueDate:
          type: string
          format: date
          example: 2026-10-05


    CreateRepaymentRequest:

      type: object

      required:
        - amount
        - paymentDate

      properties:

        amount:
          type: number
          example: 12500

        paymentDate:
          type: string
          format: date
          example: 2026-10-05

        paymentMode:
          type: string
          example: UPI

        referenceNumber:
          type: string
          nullable: true
          example: UPI123456789


    # ==================================================
    # COLLECTION
    # ==================================================

    CreateCollectionFollowUpRequest:

      type: object

      required:
        - followUpDate

      properties:

        followUpDate:
          type: string
          format: date-time
          example: 2026-09-15T11:00:00Z

        notes:
          type: string
          example: Customer promised payment tomorrow

        status:
          type: string
          example: PENDING


    # ==================================================
    # DOCUMENT
    # ==================================================

    DocumentStatusRequest:

      type: object

      required:
        - status

      properties:

        status:
          type: string
          enum:
            - PENDING
            - RECEIVED
            - VERIFIED
          example: VERIFIED

        rejectionReason:
          type: string
          nullable: true
          example: Document image is unclear


    # ==================================================
    # TARGET
    # ==================================================

    CreateTargetRequest:

      type: object

      required:
        - userId
        - period
        - targetLeads
        - targetDisbursement

      properties:

        userId:
          type: string
          example: cmtelecaller123

        period:
          type: string
          description: Target month in YYYY-MM format
          example: 2026-09

        targetLeads:
          type: integer
          minimum: 0
          example: 100

        targetDisbursement:
          type: integer
          minimum: 0
          example: 20


    # ==================================================
    # MASTER DATA
    # ==================================================

    MasterDataRequest:

      type: object

      required:
        - type
        - value

      properties:

        type:
          type: string
          example: LOAN_TYPE

        value:
          type: string
          example: PERSONAL

        label:
          type: string
          example: Personal Loan

        isActive:
          type: boolean
          example: true


    # ==================================================
    # STANDARD RESPONSES
    # ==================================================

    SuccessResponse:

      type: object

      properties:

        success:
          type: boolean
          example: true

        message:
          type: string
          example: Operation successful

        data:
          type: object
          additionalProperties: true


    ValidationError:

      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Validation failed

        errors:

          type: array

          items:

            type: object

            properties:

              field:
                type: string
                example: mobile

              message:
                type: string
                example: Mobile must be 10 digits


    UnauthorizedError:

      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Authentication required


    ForbiddenError:

      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: You are not authorized to perform this action


    NotFoundError:

      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Resource not found