openapi: 3.0.3

info:
  title: FinBoat CRM API
  version: 1.0.0
  description: |
    FinBoat CRM Backend API Documentation.

    FinBoat CRM manages the complete loan lifecycle.

    Main modules:
    - Authentication
    - Users
    - Teams
    - Leads
    - Calls
    - Follow-ups
    - Applications
    - Lenders
    - Loans
    - EMI
    - Repayments
    - Collections
    - Documents
    - Notifications
    - Targets
    - Master Data
    - Reports
    - Search
    - Audit Logs

    Roles:
    - ADMIN: Full system access
    - MANAGER: Own team scope
    - TL: Own telecaller scope
    - TELECALLER: Own assigned leads

servers:
  - url: http://localhost:5000
    description: Local Development Server

tags:

  - name: Auth
    description: Authentication APIs

  - name: Users
    description: User management APIs

  - name: Teams
    description: Team management APIs

  - name: Leads
    description: Lead management APIs

  - name: Calls
    description: Call management APIs

  - name: Follow-ups
    description: Lead follow-up APIs

  - name: Applications
    description: Loan application APIs

  - name: Lenders
    description: Lender management APIs

  - name: Loans
    description: Loan account APIs

  - name: Repayments
    description: EMI and repayment APIs

  - name: Collections
    description: Collection follow-up APIs

  - name: Documents
    description: Document and KYC APIs

  - name: Notifications
    description: Notification APIs

  - name: Targets
    description: Telecaller target APIs

  - name: Master Data
    description: Master data APIs

  - name: Reports
    description: CRM and financial reports

  - name: Search
    description: Global CRM search APIs

  - name: Audit Logs
    description: System audit log APIs

paths:

  # ====================================================
  # AUTH
  # ====================================================

  /api/auth/login:

    post:

      tags:
        - Auth

      summary: Login user

      description: |
        Authenticate a FinBoat CRM user and return a JWT token.

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:

        "200":
          description: Login successful

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/LoginResponse"

        "400":
          description: Validation failed

        "401":
          description: Invalid credentials


  # ====================================================
  # USERS
  # ====================================================

  /api/users:

    post:

      tags:
        - Users

      summary: Create user

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateUserRequest"

      responses:

        "201":
          description: User created successfully

          content:

            application/json:

              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "400":
          description: Validation failed

        "401":
          description: Authentication required

        "403":
          description: Forbidden


    get:

      tags:
        - Users

      summary: Get users

      security:
        - bearerAuth: []

      parameters:

        - name: role
          in: query
          schema:
            type: string
            enum:
              - ADMIN
              - MANAGER
              - TL
              - TELECALLER

        - name: page
          in: query
          schema:
            type: integer
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100

      responses:

        "200":
          description: Users retrieved successfully

        "401":
          description: Authentication required


  /api/users/{id}:

    get:

      tags:
        - Users

      summary: Get user by ID

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: User retrieved successfully

        "404":
          description: User not found


  # ====================================================
  # TEAMS
  # ====================================================

  /api/teams:

    post:

      tags:
        - Teams

      summary: Create team

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateTeamRequest"

      responses:

        "201":
          description: Team created successfully

        "400":
          description: Validation failed

        "401":
          description: Authentication required

        "403":
          description: Forbidden


    get:

      tags:
        - Teams

      summary: Get teams

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Teams retrieved successfully

        "401":
          description: Authentication required


  # ====================================================
  # LEADS
  # ====================================================
paths:

  /api/leads:

    post:

      tags:
        - Leads

      summary: Create a new lead

      description: Create a new CRM lead.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateLeadRequest"

      responses:

        "201":
          description: Lead created successfully

          content:
            application/json:

              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "400":
          description: Validation failed

          content:
            application/json:

              schema:
                $ref: "#/components/schemas/ValidationError"

        "401":
          description: Authentication required

        "403":
          description: Forbidden

        "409":
          description: Duplicate lead

  /api/leads/{id}:  
    get:

      tags:
        - Leads

      summary: Get leads

      description: Get paginated leads with optional filters.

      security:
        - bearerAuth: []

      parameters:

        - name: search
          in: query
          description: Search by customer name or mobile
          schema:
            type: string
            example: Rahul

        - name: status
          in: query
          schema:
            type: string
            enum:
              - NEW
              - INTERESTED
              - DOCUMENTS_PENDING
              - LOGIN
              - APPROVED
              - DISBURSED
              - REJECTED

        - name: loanType
          in: query
          schema:
            type: string
            example: PERSONAL

        - name: source
          in: query
          schema:
            type: string
            example: WEBSITE

        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Leads retrieved successfully

          content:
            application/json:

              schema:
                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Leads retrieved successfully

                  data:
                    type: object

                    properties:

                      leads:
                        type: array
                        items:
                          $ref: "#/components/schemas/Lead"

                      pagination:
                        $ref: "#/components/schemas/Pagination"

        "401":
          description: Authentication required

        "403":
          description: Forbidden

  /api/leads/{id}:

    get:

      tags:
        - Leads

      summary: Get lead by ID

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: string

          example: cm123abc

      responses:

        "200":
          description: Lead retrieved successfully

          content:
            application/json:

              schema:
                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Lead retrieved successfully

                  data:
                    $ref: "#/components/schemas/Lead"

        "401":
          description: Authentication required

        "404":
          description: Lead not found

  /api/leads/{id}/assign:

    patch:

      tags:
        - Leads

      summary: Assign or reassign lead

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/AssignLeadRequest"

      responses:

        "200":
          description: Lead assigned successfully

        "400":
          description: Invalid assignment

        "404":
          description: Lead or target user not found


  /api/leads/{id}/status:

    patch:

      tags:
        - Leads

      summary: Change lead status

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/ChangeLeadStatusRequest"

      responses:

        "200":
          description: Lead status changed successfully

        "400":
          description: Invalid status

        "404":
          description: Lead not found


  /api/leads/{id}/transfers:

    get:

      tags:
        - Leads

      summary: Get lead transfer history

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Transfer history retrieved successfully

        "404":
          description: Lead not found


  # ====================================================
  # CALLS
  # ====================================================

  /api/calls:

    post:

      tags:
        - Calls

      summary: Create call log

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateCallRequest"

      responses:

        "201":
          description: Call log created successfully

        "400":
          description: Validation failed

        "401":
          description: Authentication required


    get:

      tags:
        - Calls

      summary: Get call logs

      security:
        - bearerAuth: []

      parameters:

        - name: leadId
          in: query
          schema:
            type: string

        - name: status
          in: query
          schema:
            type: string
            enum:
              - CONNECTED
              - NOT_CONNECTED
              - BUSY
              - WRONG_NUMBER

        - name: page
          in: query
          schema:
            type: integer
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            default: 20

      responses:

        "200":
          description: Call logs retrieved successfully


  # ====================================================
  # FOLLOW UPS
  # ====================================================

  /api/followups/{leadId}:

    post:

      tags:
        - Follow-ups

      summary: Create lead follow-up

      security:
        - bearerAuth: []

      parameters:

        - name: leadId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateFollowUpRequest"

      responses:

        "201":
          description: Follow-up created successfully

        "400":
          description: Validation failed

        "404":
          description: Lead not found


  /api/followups/{id}:

    patch:

      tags:
        - Follow-ups

      summary: Update follow-up

      description: |
        Update follow-up status and notes.

        Example status:
        DONE

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/UpdateFollowUpRequest"

      responses:

        "200":
          description: Follow-up updated successfully

        "400":
          description: Validation failed

        "404":
          description: Follow-up not found


  /api/followups/pending:

    get:

      tags:
        - Follow-ups

      summary: Get pending follow-ups

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Pending follow-ups retrieved successfully


  /api/followups/overdue:

    get:

      tags:
        - Follow-ups

      summary: Get overdue follow-ups

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Overdue follow-ups retrieved successfully


  /api/followups/summary:

    get:

      tags:
        - Follow-ups

      summary: Get follow-up summary

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Follow-up summary retrieved successfully


  # ====================================================
  # APPLICATIONS
  # ====================================================

  /api/applications/leads/{leadId}:

    post:

      tags:
        - Applications

      summary: Create application for lead

      security:
        - bearerAuth: []

      parameters:

        - name: leadId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: false

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"

      responses:

        "201":
          description: Application created successfully

        "400":
          description: Invalid application

        "404":
          description: Lead not found

        "409":
          description: Active application already exists


  /api/applications:

    get:

      tags:
        - Applications

      summary: Get applications

      security:
        - bearerAuth: []

      parameters:

        - name: status
          in: query
          schema:
            type: string

        - name: page
          in: query
          schema:
            type: integer
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            default: 20

      responses:

        "200":
          description: Applications retrieved successfully


  /api/applications/{id}:

    get:

      tags:
        - Applications

      summary: Get application by ID

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Application retrieved successfully

        "404":
          description: Application not found


    patch:

      tags:
        - Applications

      summary: Update application

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              type: object

      responses:

        "200":
          description: Application updated successfully


  /api/applications/{id}/status:

    patch:

      tags:
        - Applications

      summary: Change application status

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/ChangeApplicationStatusRequest"

      responses:

        "200":
          description: Application status changed successfully

        "400":
          description: Invalid status transition


  /api/applications/{id}/timeline:

    get:

      tags:
        - Applications

      summary: Get application timeline

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Application timeline retrieved successfully


  /api/applications/{id}/status-history:

    get:

      tags:
        - Applications

      summary: Get application status history

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Application status history retrieved successfully


  # ====================================================
  # LENDERS
  # ====================================================

  /api/lenders:

    post:

      tags:
        - Lenders

      summary: Create lender

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateLenderRequest"

      responses:

        "201":
          description: Lender created successfully

        "400":
          description: Validation failed

        "403":
          description: Admin access required


    get:

      tags:
        - Lenders

      summary: Get lenders

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Lenders retrieved successfully


  # ====================================================
  # LOANS
  # ====================================================

  /api/loans/applications/{applicationId}/convert:

    post:

      tags:
        - Loans

      summary: Convert application into loan

      security:
        - bearerAuth: []

      parameters:

        - name: applicationId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: false

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/ConvertLoanRequest"

      responses:

        "201":
          description: Loan created successfully

        "400":
          description: Conversion failed

        "404":
          description: Application not found


  /api/loans:

    get:

      tags:
        - Loans

      summary: Get loans

      security:
        - bearerAuth: []

      parameters:

        - name: status
          in: query
          schema:
            type: string

        - name: page
          in: query
          schema:
            type: integer
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            default: 20

      responses:

        "200":
          description: Loans retrieved successfully


  /api/loans/{id}:

    get:

      tags:
        - Loans

      summary: Get loan by ID

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Loan retrieved successfully

        "404":
          description: Loan not found


  /api/loans/{id}/status:

    patch:

      tags:
        - Loans

      summary: Change loan status

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

              required:
                - status

              properties:

                status:
                  type: string
                  example: ACTIVE

      responses:

        "200":
          description: Loan status updated successfully


  # ====================================================
  # EMI
  # ====================================================

  /api/loans/{loanAccountId}/emi-schedule:

    post:

      tags:
        - Repayments

      summary: Create EMI schedule

      security:
        - bearerAuth: []

      parameters:

        - name: loanAccountId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateEmiScheduleRequest"

      responses:

        "201":
          description: EMI schedule created successfully

        "400":
          description: Validation failed


    get:

      tags:
        - Repayments

      summary: Get EMI schedule

      security:
        - bearerAuth: []

      parameters:

        - name: loanAccountId
          in: path
          required: true
          schema:
            type: string

      responses:

        "200":
          description: EMI schedule retrieved successfully


  /api/loans/{loanAccountId}/repayments:

    post:

      tags:
        - Repayments

      summary: Record repayment

      security:
        - bearerAuth: []

      parameters:

        - name: loanAccountId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateRepaymentRequest"

      responses:

        "201":
          description: Repayment recorded successfully

        "400":
          description: Validation failed


  /api/loans/{loanAccountId}/repayment-summary:

    get:

      tags:
        - Repayments

      summary: Get repayment summary

      security:
        - bearerAuth: []

      parameters:

        - name: loanAccountId
          in: path
          required: true
          schema:
            type: string

      responses:

        "200":
          description: Repayment summary retrieved successfully


  # ====================================================
  # COLLECTIONS
  # ====================================================

  /api/loans/{loanAccountId}/followups:

    post:

      tags:
        - Collections

      summary: Create collection follow-up

      security:
        - bearerAuth: []

      parameters:

        - name: loanAccountId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateCollectionFollowUpRequest"

      responses:

        "201":
          description: Collection follow-up created successfully


  /api/collection-followups:

    get:

      tags:
        - Collections

      summary: Get collection follow-ups

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Collection follow-ups retrieved successfully


  /api/collection-followups/{id}:

    patch:

      tags:
        - Collections

      summary: Update collection follow-up

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              type: object

      responses:

        "200":
          description: Collection follow-up updated successfully


  /api/collection-summary:

    get:

      tags:
        - Collections

      summary: Get collection summary

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Collection summary retrieved successfully


  # ====================================================
  # DOCUMENTS
  # ====================================================

  /api/documents/lead/{leadId}:

    post:

      tags:
        - Documents

      summary: Upload lead document

      description: |
        Upload a document for a lead.

        Supported multipart form fields:
        - file
        - applicationId
        - documentType

      security:
        - bearerAuth: []

      parameters:

        - name: leadId
          in: path
          required: true
          schema:
            type: string

      requestBody:

        required: true

        content:

          multipart/form-data:

            schema:

              type: object

              required:
                - file
                - documentType

              properties:

                file:
                  type: string
                  format: binary

                applicationId:
                  type: string
                  nullable: true

                documentType:
                  type: string
                  example: PAN

      responses:

        "201":
          description: Document uploaded successfully

        "400":
          description: Invalid document

        "401":
          description: Authentication required


  /api/documents/{id}:

    get:

      tags:
        - Documents

      summary: Get document by ID

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Document retrieved successfully

        "404":
          description: Document not found


    delete:

      tags:
        - Documents

      summary: Delete document

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Document deleted successfully


  /api/documents/{id}/file:

    get:

      tags:
        - Documents

      summary: Get document file

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Document file


  /api/documents/{id}/status:

    patch:

      tags:
        - Documents

      summary: Update document status

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/DocumentStatusRequest"

      responses:

        "200":
          description: Document status updated successfully


  # ====================================================
  # NOTIFICATIONS
  # ====================================================

  /api/notifications:

    get:

      tags:
        - Notifications

      summary: Get notifications

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Notifications retrieved successfully


  /api/notifications/unread-count:

    get:

      tags:
        - Notifications

      summary: Get unread notification count

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Unread count retrieved successfully


  /api/notifications/{id}/read:

    patch:

      tags:
        - Notifications

      summary: Mark notification as read

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/Id"

      responses:

        "200":
          description: Notification marked as read


  /api/notifications/read-all:

    patch:

      tags:
        - Notifications

      summary: Mark all notifications as read

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Notifications marked as read


  /api/notifications/preferences:

    get:

      tags:
        - Notifications

      summary: Get notification preferences

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Notification preferences retrieved successfully


    patch:

      tags:
        - Notifications

      summary: Update notification preferences

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:
              type: object

      responses:

        "200":
          description: Notification preferences updated successfully


  # ====================================================
  # TARGETS
  # ====================================================

  /api/targets:

    post:

      tags:
        - Targets

      summary: Create telecaller target

      description: |
        Create a monthly target for a telecaller.

        Example period:
        2026-09

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: "#/components/schemas/CreateTargetRequest"

      responses:

        "201":
          description: Target created successfully

        "400":
          description: Validation failed

        "403":
          description: Only ADMIN or MANAGER can create targets

        "404":
          description: Target user not found


    get:

